<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>APIClient Docs</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f3;
        --card: #ffffff;
        --text: #182025;
        --muted: #5f6b73;
        --accent: #0e7490;
        --border: #d7dde1;
        --code-bg: #eef2f4;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(180deg, #eef3f1 0%, var(--bg) 100%);
        color: var(--text);
      }
      .page {
        max-width: 1100px;
        margin: 0 auto;
        padding: 32px 20px 64px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: 0 12px 40px rgba(24, 32, 37, 0.06);
        padding: 28px;
      }
      .nav {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 20px;
      }
      .nav a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
      }
      h1, h2, h3 {
        line-height: 1.2;
      }
      h1 { margin-top: 0; font-size: 2rem; }
      h2 {
        margin-top: 2.4rem;
        padding-top: 1rem;
        border-top: 1px solid var(--border);
      }
      p, li {
        color: var(--text);
        line-height: 1.65;
      }
      ul {
        padding-left: 1.2rem;
      }
      code {
        background: var(--code-bg);
        padding: 0.15rem 0.35rem;
        border-radius: 6px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      pre {
        background: var(--code-bg);
        padding: 16px;
        overflow-x: auto;
        border-radius: 12px;
        border: 1px solid var(--border);
      }
      pre code {
        background: transparent;
        padding: 0;
      }
      .muted {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="nav">
        <a href="./index.html">Главная</a>
        <a href="./api-reference.html">API Reference</a>
      </div>
      <div class="card">
        
<h1>APIClient Docs</h1>
<p class="muted">Статическая документация SDK, публикуемая через GitHub Pages.</p>
<ul>
  <li><a href="./api-reference.html">API Reference</a></li>
  <li><a href="https://github.com/raspopovaa/APIforCards">GitHub repository</a></li>
  <li><a href="https://github.com/raspopovaa/APIforCards/blob/main/README.md">README</a></li>
</ul>
<p>Сайт собирается автоматически из локальной документации и introspection-данных SDK.</p>

      </div>
    </div>
  </body>
</html>
