# pyproject.toml
[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "api-client-opti24"
version = "1.0.2"
description = "Асинхронный Python-клиент для сервиса API топливных карт"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Andrey Raspopov", email = "andrey.raspopov@gmail.com" },
]
requires-python = ">=3.13,<3.15"
keywords = ["api-client", "asyncio", "httpx", "dataclasses", "gazpromneft", "opt24"]

dependencies = [
    "httpx>=0.27.0,<1.0",
]

[project.urls]
Homepage = "https://github.com/raspopovaa/APIforCards"
Repository = "https://github.com/raspopovaa/APIforCards"
Issues = "https://github.com/raspopovaa/APIforCards/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["api_client_opti24*"]
exclude = ["examples", "tests", "docs"]

[tool.setuptools]
package-dir = {"" = "src"}

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "black>=24.3.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.black]
line-length = 100
target-version = ["py313"]
skip-string-normalization = true

[tool.ruff]
# Общие настройки (например, target-version, line-length)
target-version = "py313"
line-length = 88
indent-width = 4

[tool.ruff.lint]
# Настройки линтера
select = ["E", "W", "F", "I", "B", "C4", "T10", "SIM", "PTH", "ARG", "UP", "YTT"]
ignore = ["E501"]
fixable = ["ALL"]

[tool.mypy]
python_version = "3.13"
strict = true
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = "(venv|tests|build|dist)"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"
