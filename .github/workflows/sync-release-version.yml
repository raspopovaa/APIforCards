name: Sync release version

on:
  push:
    branches:
      - agent/stage1-production-hardening

permissions:
  contents: write

jobs:
  sync-lock-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage1-production-hardening

      - name: Synchronize local package version in uv.lock
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          lock_path = Path("uv.lock")
          lock_text = lock_path.read_text(encoding="utf-8")
          marker = 'name = "api-client-opti24"\nversion = "'
          start = lock_text.find(marker)
          if start < 0:
              raise SystemExit("local package entry was not found in uv.lock")
          version_start = start + len(marker)
          version_end = lock_text.find('"', version_start)
          current = lock_text[version_start:version_end]
          if current == version:
              raise SystemExit(0)
          lock_path.write_text(
              lock_text[:version_start] + version + lock_text[version_end:],
              encoding="utf-8",
          )
          print(f"uv.lock: {current} -> {version}")
          PY

      - name: Commit synchronized lock version
        run: |
          if git diff --quiet -- uv.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "Synchronize uv.lock with SDK version"
          git push origin HEAD:agent/stage1-production-hardening
