name: Materialize contract audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/api-1160-contract-audit'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/api-1160-contract-audit

      - name: Record bundle diagnostics
        run: |
          : > .contract-audit-diagnostic
          for part in .contract-audit-bundle.part.*; do
            normalized="/tmp/$(basename "$part").normalized"
            tr -d '[:space:]' < "$part" > "$normalized"
            printf '%s %s %s\n' \
              "$(basename "$part")" \
              "$(wc -c < "$normalized")" \
              "$(sha256sum "$normalized" | cut -d' ' -f1)" \
              >> .contract-audit-diagnostic
          done
          cat .contract-audit-bundle.part.* | tr -d '[:space:]' > /tmp/contract-audit-bundle.b64
          printf 'combined %s %s\n' \
            "$(wc -c < /tmp/contract-audit-bundle.b64)" \
            "$(sha256sum /tmp/contract-audit-bundle.b64 | cut -d' ' -f1)" \
            >> .contract-audit-diagnostic

      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .contract-audit-diagnostic
          git commit -m "chore: record contract bundle diagnostics"
          git push origin HEAD:agent/api-1160-contract-audit
