name: Finalize Documentation Release

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/unified-sdk-documentation'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/unified-sdk-documentation
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Synchronize release version and generator
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("pyproject.toml"): [('version = "2.2.2"', 'version = "2.2.3"')],
              Path("uv.lock"): [
                  ('name = "api-client-opti24"\nversion = "2.2.2"',
                   'name = "api-client-opti24"\nversion = "2.2.3"')
              ],
              Path("tests/test_package_smoke.py"): [
                  ('assert __version__ == "2.2.1"', 'assert __version__ == "2.2.3"')
              ],
              Path("scripts/generate_docs.py"): [
                  (
                      'clean_docstring(model) or "Модель данных SDK.",',
                      'inspect.cleandoc(vars(model).get("__doc__") or "") '
                      'or "Модель данных SDK.",',
                  )
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old in text:
                      text = text.replace(old, new, 1)
                  elif new not in text:
                      raise SystemExit(f"Expected release marker not found in {path}")
              path.write_text(text, encoding="utf-8")

          for path in (
              Path("README.md"),
              Path("docs/index.md"),
              Path("docs/getting-started.md"),
              Path("docs/versioning.md"),
          ):
              text = path.read_text(encoding="utf-8")
              path.write_text(text.replace("2.2.2", "2.2.3"), encoding="utf-8")
          PY

      - name: Reinstall release metadata
        run: python -m pip install --force-reinstall --no-deps -e .

      - name: Generate documentation
        run: python scripts/generate_docs.py

      - name: Format changed Python files
        run: |
          ruff check --fix scripts/generate_docs.py tests/test_documentation_generator.py tests/test_package_smoke.py
          black scripts/generate_docs.py tests/test_documentation_generator.py tests/test_package_smoke.py

      - name: Run full test suite
        run: pytest

      - name: Verify external API contract
        run: python scripts/verify_external_contract.py specifications/api-methods.yaml

      - name: Run lint checks
        run: ruff check src tests scripts

      - name: Check formatting
        run: black --check src tests scripts

      - name: Type-check SDK
        run: mypy src/api_client_opti24

      - name: Build documentation in strict mode
        run: mkdocs build --strict

      - name: Commit generated documentation and release metadata
        run: |
          rm .github/workflows/finalize-docs-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize SDK documentation release 2.2.3"
          git push origin HEAD:agent/unified-sdk-documentation
