name: Apply approved parameter descriptions

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'docs/spec-parameter-descriptions'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout documentation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Add specification metadata support
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/documentation_generator.py')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  'METADATA_PATH = PROJECT_ROOT / "specifications" / "documentation.yaml"\n',
                  'METADATA_PATH = PROJECT_ROOT / "specifications" / "documentation.yaml"\n'
                  'PARAMETER_METADATA_PATH = (\n'
                  '    PROJECT_ROOT / "specifications" / "parameter-descriptions-1.1.60.yaml"\n'
                  ')\n',
              ),
              (
                  '''    value = yaml.safe_load(METADATA_PATH.read_text(encoding="utf-8")) or {}\n    return {\n        "domains": value.get("domains", {}),\n        "operations": value.get("operations", {}),\n        "parameters": value.get("parameters", {}),\n    }\n''',
                  '''    value = yaml.safe_load(METADATA_PATH.read_text(encoding="utf-8")) or {}\n    operations = value.get("operations", {})\n    if PARAMETER_METADATA_PATH.exists():\n        parameter_value = (\n            yaml.safe_load(PARAMETER_METADATA_PATH.read_text(encoding="utf-8")) or {}\n        )\n        for operation, operation_meta in parameter_value.get("operations", {}).items():\n            target = operations.setdefault(operation, {})\n            target.setdefault("parameters", {}).update(\n                operation_meta.get("parameters", {})\n            )\n    return {\n        "domains": value.get("domains", {}),\n        "operations": operations,\n        "parameters": value.get("parameters", {}),\n    }\n''',
              ),
              (
                  '''def parameter_description(\n    name: str,\n    doc_params: dict[str, str],\n    metadata: dict[str, Any],\n) -> str:\n    common = metadata.get("parameters", {})\n    description = doc_params.get(name) or common.get(name)\n''',
                  '''def parameter_description(\n    name: str,\n    doc_params: dict[str, str],\n    metadata: dict[str, Any],\n    operation_meta: dict[str, Any] | None = None,\n) -> str:\n    operation_parameters = (operation_meta or {}).get("parameters", {})\n    common = metadata.get("parameters", {})\n    description = operation_parameters.get(name) or doc_params.get(name) or common.get(name)\n''',
              ),
              (
                  'def render_parameters(method: object, metadata: dict[str, Any]) -> list[str]:',
                  '''def render_parameters(\n    method: object,\n    metadata: dict[str, Any],\n    operation_meta: dict[str, Any] | None = None,\n) -> list[str]:''',
              ),
              (
                  'description = parameter_description(name, doc_params, metadata)',
                  'description = parameter_description(name, doc_params, metadata, operation_meta)',
              ),
              (
                  '*render_parameters(method, metadata),',
                  '*render_parameters(method, metadata, op_meta),',
              ),
              (
                  'def validate(grouped: dict[str, list[Any]], models: list[type[BaseModel]]) -> None:\n    services = service_classes()\n    errors: list[str] = []\n',
                  '''def validate(\n    grouped: dict[str, list[Any]],\n    models: list[type[BaseModel]],\n    metadata: dict[str, Any],\n) -> None:\n    services = service_classes()\n    operations_meta = metadata.get("operations", {})\n    errors: list[str] = []\n''',
              ),
              (
                  '''            if not clean_docstring(method):\n                errors.append(f"{service_name}.{spec.name}: missing docstring")\n''',
                  '''            if not clean_docstring(method):\n                errors.append(f"{service_name}.{spec.name}: missing docstring")\n            declared_parameters = operations_meta.get(spec.name, {}).get("parameters", {})\n            unknown_parameters = set(declared_parameters) - set(inspect.signature(method).parameters)\n            if unknown_parameters:\n                errors.append(\n                    f"{service_name}.{spec.name}: metadata contains unknown parameters "\n                    f"{sorted(unknown_parameters)}"\n                )\n''',
              ),
              ('validate(grouped, models)', 'validate(grouped, models, metadata)'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected generator fragment not found: {old[:100]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_documentation_generator.py')
          tests = test_path.read_text(encoding='utf-8')
          if 'import inspect\n' not in tests:
              tests = tests.replace('import ast\n', 'import ast\nimport inspect\n', 1)
          addition = '''\n\ndef test_approved_spec_parameter_descriptions_are_applied() -> None:\n    generator = load_generator()\n    metadata = generator.load_metadata()\n    operations = metadata["operations"]\n    approved = {\n        (operation, parameter): description\n        for operation, operation_meta in operations.items()\n        for parameter, description in operation_meta.get("parameters", {}).items()\n    }\n\n    assert len(approved) == 69\n    assert approved[("move_to_card", "amount")] == "Сумма перевода."\n\n    services = generator.service_classes()\n    specs = {spec.name: spec for spec in generator.documented_specs()}\n    for (operation, parameter), expected in approved.items():\n        spec = specs[operation]\n        service_name = generator.SERVICE_NAMES[spec.domain]\n        method = generator.public_service_methods(services[service_name])[operation]\n        assert parameter in inspect.signature(method).parameters, f"{operation}.{parameter}"\n        doc_params = generator.parse_param_docs(generator.clean_docstring(method))\n        actual = generator.parameter_description(\n            parameter, doc_params, metadata, operations[operation]\n        )\n        assert actual == expected\n        assert actual != "Параметр публичного метода SDK."\n\n    output = generator.build_all()\n    ewallet_page = output[generator.METHODS_PATH / "ewallet.md"]\n    assert "| `amount` | `float` | Да | — | Сумма перевода. |" in ewallet_page\n'''
          if 'test_approved_spec_parameter_descriptions_are_applied' not in tests:
              tests = tests.rstrip() + addition + '\n'
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Format and generate documentation
        run: |
          ruff check scripts/documentation_generator.py tests/test_documentation_generator.py --fix
          black scripts/documentation_generator.py tests/test_documentation_generator.py
          python scripts/generate_docs.py

      - name: Verify
        run: |
          pytest -q
          python scripts/verify_external_contract.py specifications/api-methods.yaml
          ruff check src tests scripts
          black --check src tests scripts
          mypy src/api_client_opti24
          mkdocs build --strict

      - name: Commit generated documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-approved-parameter-descriptions.yml
          git add specifications/parameter-descriptions-1.1.60.yaml scripts/documentation_generator.py tests/test_documentation_generator.py docs
          git commit -m 'docs: apply API specification parameter descriptions'
          git push origin HEAD:${{ github.head_ref }}
