name: Docs

on:
  pull_request:
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generate API documentation
        run: python scripts/generate_api_docs.py

      - name: Generate method catalog
        run: python scripts/generate_method_catalog.py

      - name: Verify generated Markdown is committed
        run: git diff --exit-code -- docs/api-reference.md docs/methods.md

      - name: Build documentation site
        run: python scripts/build_docs_site.py

      - name: Upload documentation site
        uses: actions/upload-artifact@v4
        with:
          name: documentation-site
          path: site/
