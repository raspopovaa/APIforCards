name: Format architecture changes

on:
  push:
    branches:
      - ci/architecture-validation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ci/architecture-validation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Black
        run: python -m pip install black==26.5.1

      - name: Format changed files
        run: |
          black \
            src/api_client_opti24/authentication.py \
            src/api_client_opti24/services/templates.py \
            src/api_client_opti24/transport.py \
            tests/test_architecture_refactor.py

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/api_client_opti24/authentication.py \
            src/api_client_opti24/services/templates.py \
            src/api_client_opti24/transport.py \
            tests/test_architecture_refactor.py
          git commit -m "style: format architecture changes"
          git push origin HEAD:ci/architecture-validation
