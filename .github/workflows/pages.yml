name: Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name != 'pull_request' ||
      startsWith(github.head_ref, 'docs-release/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generate documentation
        run: python scripts/generate_docs.py

      - name: Verify documentation contracts
        run: pytest -q tests/test_documentation_generator.py

      - name: Determine documentation version
        run: |
          version=$(python -c 'import tomllib; value = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]; print(".".join(value.split(".")[:2]))')
          echo "DOCS_VERSION=$version" >> "$GITHUB_ENV"

      - name: Publish versioned documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth=1
          mike deploy --push --update-aliases --alias-type=redirect "$DOCS_VERSION" latest
          mike set-default --push latest

      - name: Verify published version
        run: |
          git fetch origin gh-pages --depth=1
          git show "origin/gh-pages:$DOCS_VERSION/methods/index.html" | grep -Fq "82 операций"
          git show "origin/gh-pages:$DOCS_VERSION/methods/auth/index.html" | grep -Fq "Возвращаемое значение"

      - name: Export versioned site
        run: |
          rm -rf site
          mkdir site
          git archive origin/gh-pages | tar -x -C site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: >-
      github.event_name != 'pull_request' ||
      startsWith(github.head_ref, 'docs-release/')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
