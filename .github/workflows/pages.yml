name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generate API docs
        run: python scripts/generate_api_docs.py

      - name: Generate method catalog
        run: python scripts/generate_method_catalog.py

      - name: Determine documentation version
        run: |
          version=$(python -c 'import tomllib; value = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]; print(".".join(value.split(".")[:2]))')
          echo "DOCS_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build versioned documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mike deploy --update-aliases --alias-type=redirect "$DOCS_VERSION" latest
          mike set-default --push latest

      - name: Export versioned site
        run: |
          git fetch origin gh-pages
          rm -rf site
          mkdir site
          git archive origin/gh-pages | tar -x -C site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
