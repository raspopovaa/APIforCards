name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: pytest

      - name: Verify external API contract
        run: python scripts/verify_external_contract.py specifications/api-methods.yaml

      - name: Run verified specification audit
        run: python scripts/audit_spec_contract.py --mode verified

      - name: Run full lint checks
        run: |
          mkdir -p artifacts/ruff
          set +e
          ruff check src tests scripts tools --output-format=concise > artifacts/ruff/report.txt 2>&1
          status=$?
          cat artifacts/ruff/report.txt
          exit "$status"

      - name: Upload Ruff diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-diagnostics-${{ matrix.python-version }}
          path: artifacts/ruff/report.txt
          if-no-files-found: error

      - name: Check formatting
        run: black --check src tests scripts tools

      - name: Type-check SDK
        run: mypy src/api_client_opti24

  contract-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generate full specification audit
        run: python scripts/audit_spec_contract.py --mode audit

      - name: Upload contract audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-1.1.60-contract-audit
          path: artifacts/contract-audit/
          if-no-files-found: error
