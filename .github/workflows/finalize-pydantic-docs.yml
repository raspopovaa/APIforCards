name: Finalize Pydantic documentation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'docs/pydantic-validation-details'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout documentation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Format documentation code
        run: |
          ruff check scripts/pydantic_docs.py scripts/documentation_generator.py scripts/generate_docs.py tests/test_documentation_generator.py --fix
          black scripts/pydantic_docs.py scripts/documentation_generator.py scripts/generate_docs.py tests/test_documentation_generator.py

      - name: Generate documentation
        run: python scripts/generate_docs.py

      - name: Run tests
        run: pytest -q

      - name: Verify external API contract
        run: python scripts/verify_external_contract.py

      - name: Run lint
        run: ruff check src tests scripts

      - name: Check formatting
        run: black --check src tests scripts

      - name: Type-check SDK
        run: mypy src/api_client_opti24

      - name: Build documentation strictly
        run: mkdocs build --strict

      - name: Commit generated documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/finalize-pydantic-docs.yml
          git add docs scripts tests pyproject.toml
          if ! git diff --cached --quiet; then
            git commit -m 'docs: expand Pydantic validation reference'
            git push origin HEAD:${{ github.head_ref }}
          fi
