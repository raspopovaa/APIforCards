name: Finalize Pydantic documentation review

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'docs/pydantic-validation-details'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout documentation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply request-model documentation fix
        run: python scripts/patch_request_model_docs.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Format and generate documentation
        run: |
          ruff check scripts tests/test_documentation_generator.py --fix
          black scripts tests/test_documentation_generator.py
          python scripts/generate_docs.py

      - name: Verify documentation and SDK
        run: |
          pytest -q
          python scripts/verify_external_contract.py specifications/api-methods.yaml
          ruff check src tests scripts
          black --check src tests scripts
          mypy src/api_client_opti24
          mkdocs build --strict

      - name: Commit generated documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/finalize-pydantic-docs.yml
          git rm -f .github/workflows/address-request-model-review.yml
          git rm scripts/patch_request_model_docs.py
          git add docs scripts tests
          git commit -m 'docs: clarify request model validation scope'
          git push origin HEAD:${{ github.head_ref }}
